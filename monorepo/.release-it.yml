# yaml-language-server: $schema=../node_modules/release-it/schema/release-it.json

extends: ../base
plugins:
  '@release-it/conventional-changelog':
    path: ./
    gitRawCommitsOpts:
      path: ./
git:
  tagName: '${npm.name}@${version}'
  commitMessage: 'chore(release): ${npm.name} v${version}'
  commitsPath: ./
  requireCommits: true
  requireCommitsFail: false
